name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: the connector parity test (test/parity.test.ts) needs the recorded commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
      - run: bun test
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, by tag and digest (the digest is what Docker resolves; the tag is
      # for readers). Dependabot does not update images named inside a `run:` line: bump both by hand.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  # The packed tarball, installed the way a user installs it, in a clean Node container: first
  # without its `bun` dependency (what `--ignore-scripts` leaves is a stub) and with no Bun on
  # PATH (the launcher must exit 2 with the install line), then the real dependency from the
  # registry with only node on PATH (the launcher must run the Bun npm installed), then a Bun on
  # PATH. The image is pinned by digest (the tag is for readers); Dependabot does not bump a
  # `container:` image, so bump both by hand. The offline checks use an empty cache and a closed
  # registry port; only `--bundled-bun` and the Bun install read the registry.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Without Bun
        run: scripts/verify-package.sh --without-bun
      - name: The bundled Bun, from the registry, with only node on PATH
        run: scripts/verify-package.sh --bundled-bun
      - name: Install Bun
        run: npm install --global bun@1.3.4
      # The default check copies chalk and Clack from this checkout's node_modules.
      - name: Install the terminal-screen packages
        run: bun install --ignore-scripts
      - name: With Bun
        run: scripts/verify-package.sh
