name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: the connector parity test (test/parity.test.ts) needs the recorded commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
      - run: bun test
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, by tag and digest (the digest is what Docker resolves; the tag is
      # for readers). Dependabot does not update images named inside a `run:` line: bump both by hand.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  # The packed tarball, installed the way a user installs it, in a clean Node container: first with
  # no Bun on PATH (the launcher must exit 2 with the install line), then with Bun. The image is
  # pinned by digest (the tag is for readers); Dependabot does not bump a `container:` image, so
  # bump both by hand. Bun comes from npm at an exact version, a registry read only: the checks
  # themselves install the tarball from a file with an empty cache and a closed registry port.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Without Bun
        run: scripts/verify-package.sh --without-bun
      - name: Install Bun
        run: npm install --global bun@1.3.4
      - name: With Bun
        run: scripts/verify-package.sh
  # Windows with Node and Bun: the launcher, the install layout, the packed file list and a local
  # review with a fake claude through the launcher. npm on Windows is advertised only while this
  # job is green (docs/local-review.md section 3).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Launcher, install layout, packed files, local review with a fake claude
        shell: bash
        run: |
          bun test ./test/launcher.test.ts ./src/install-kind.test.ts ./test/package.test.ts ./test/local-fake-provider.test.ts ./src/connectors/local-git.test.ts
          bun test ./src/providers/claude-code.test.ts -t "child environment"
      - name: Install the packed tarball with npm and run it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wachiman-pack"
          New-Item -ItemType Directory -Path $dir | Out-Null
          npm pack --pack-destination $dir --ignore-scripts
          $tgz = (Get-ChildItem $dir -Filter "wachiman-*.tgz").FullName
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP "wachiman-npm-cache"
          npm install --global --prefix (Join-Path $env:RUNNER_TEMP "wachiman-prefix") --offline --registry http://127.0.0.1:9 --ignore-scripts --no-audit --no-fund $tgz
          $expected = node -p "require('./package.json').version"
          $got = & (Join-Path $env:RUNNER_TEMP "wachiman-prefix\wachiman.cmd") --version
          if ($got -ne $expected) { throw "wachiman --version printed '$got', expected '$expected'" }
          "wachiman --version -> $got"
