name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: the connector parity test (test/parity.test.ts) needs the recorded commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
      - run: bun test
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, by tag and digest (the digest is what Docker resolves; the tag is
      # for readers). Dependabot does not update images named inside a `run:` line: bump both by hand.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  # The packed tarball, installed the way a user installs it, in a clean Node container: first with
  # no Bun on PATH (the launcher must exit 2 with the install line), then with Bun. The image is
  # pinned by digest (the tag is for readers); Dependabot does not bump a `container:` image, so
  # bump both by hand. Bun comes from npm at an exact version, a registry read only: the checks
  # themselves install the tarball from a file with an empty cache and a closed registry port.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Without Bun
        run: scripts/verify-package.sh --without-bun
      - name: Install Bun
        run: npm install --global bun@1.3.4
      - name: With Bun
        run: scripts/verify-package.sh
  # Windows with Node and Bun: the launcher, the install layout, the packed file list and a local
  # review with a fake claude through the launcher. npm on Windows is advertised only while this
  # job is green (docs/local-review.md section 3).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Launcher, install layout, packed files, local review with a fake claude
        shell: bash
        run: |
          bun test ./test/launcher.test.ts ./src/install-kind.test.ts ./test/package.test.ts ./test/local-fake-provider.test.ts ./src/connectors/local-git.test.ts
          bun test ./src/providers/claude-code.test.ts -t "child environment"
      # Row W4 of the Windows executable rows: the suites that need no real `claude` and no POSIX
      # shell script standing in for it. Left out on purpose: tests that write `#!/bin/sh` stubs,
      # make symlinks or chmod files (src/providers/claude-code.test.ts, src/local.test.ts,
      # src/accounts/config.test.ts and others), and the parity test, which needs the full history.
      - name: Suites that need no real claude (W4)
        shell: bash
        run: |
          bun test \
            ./src/flags.test.ts ./src/call-message.test.ts ./src/config.test.ts ./src/precision.test.ts ./src/formats.test.ts \
            ./src/repo-path.test.ts ./src/providers/errors.test.ts ./src/providers/claude-code.exe-settings.test.ts \
            ./src/history/fingerprint.test.ts ./src/history/index.test.ts ./src/history/match.test.ts \
            ./src/full-review.fake.test.ts ./src/review-core.fake.test.ts ./src/threads.fake.test.ts ./src/engine.fake.test.ts \
            ./src/sinks/sinks.test.ts ./src/accounts/resolve.test.ts \
            ./src/questions/index.test.ts ./src/questions/destructive-step.test.ts ./src/questions/stale-write-back.test.ts \
            ./src/questions/read-error-as-empty.test.ts ./src/questions/overlapping-calls.test.ts \
            ./test/release-workflow.test.ts ./test/exe-build.test.ts ./test/exe-smoke.test.ts
      - name: Install the packed tarball with npm and run it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wachiman-pack"
          New-Item -ItemType Directory -Path $dir | Out-Null
          npm pack --pack-destination $dir --ignore-scripts
          $tgz = (Get-ChildItem $dir -Filter "wachiman-*.tgz").FullName
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP "wachiman-npm-cache"
          npm install --global --prefix (Join-Path $env:RUNNER_TEMP "wachiman-prefix") --offline --registry http://127.0.0.1:9 --ignore-scripts --no-audit --no-fund $tgz
          $expected = node -p "require('./package.json').version"
          $got = & (Join-Path $env:RUNNER_TEMP "wachiman-prefix\wachiman.cmd") --version
          if ($got -ne $expected) { throw "wachiman --version printed '$got', expected '$expected'" }
          "wachiman --version -> $got"
  # The Windows executable, cross-built the way the release builds it (`--target bun-windows-x64`),
  # then run on Windows with a fake claude: one step per row of "Windows executable" in the
  # design's acceptance criteria, so a red step names the row. The tier stays "built and
  # smoke-tested" until these are green on a published commit (docs/local-review.md section 3).
  # Row W7, the one real run on a Windows machine, is the owner's and has no step here.
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Build wachiman.exe with the dotenv and bunfig autoload off
        run: |
          version="$(bun -p "require('./package.json').version")"
          echo "WACHIMAN_VERSION=$version" >> "$GITHUB_ENV"
          bun scripts/build-exe.ts --outfile dist/wachiman.exe --target bun-windows-x64 --version "$version"
      - name: "W1: --version prints the version, and a sentinel bunfig preload and dotenv file have no effect"
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$WACHIMAN_VERSION" --rows W1
      - name: "W2: local --input gives the ReviewResult of bun src/cli.ts, with forward-slash paths"
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$WACHIMAN_VERSION" --rows W2
      - name: "W3: the embedded settings reach claude as a temp file with the shipped bytes, removed after the call"
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$WACHIMAN_VERSION" --rows W3
      - name: "W5: Ctrl-C during a fake run exits 130 and removes the snapshot"
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$WACHIMAN_VERSION" --rows W5
      - name: "W6: a profile with --binary claude.exe runs, and claude.cmd is refused"
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$WACHIMAN_VERSION" --rows W6
