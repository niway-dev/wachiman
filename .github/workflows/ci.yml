name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # The tests run in four parallel jobs, because Bun 1.3.4 (the pinned version) has no `--shard`.
  # scripts/test-shard.ts splits the files by recorded time (scripts/test-timings.json) and its
  # --check step fails when a file it finds would be in no shard or in two, or when a tracked test
  # file is outside what it finds; each shard also checks that Bun ran as many files as it listed.
  tests:
    name: tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: the connector parity test (test/parity.test.ts) needs the recorded commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
      # The differential test (src/evidence-search.test.ts) compares ripgrep with `git grep`, so it
      # needs the pinned ripgrep; it skips itself when there is none.
      - name: Install ripgrep
        run: bun --no-env-file --config=bunfig.toml src/install-ripgrep.ts
      # The shard count comes from the matrix itself (strategy.job-total), so the split cannot
      # disagree with the number of jobs.
      - name: Every test file is in exactly one shard
        env:
          TOTAL: ${{ strategy.job-total }}
        run: bun scripts/test-shard.ts --check "$TOTAL"
      - name: Run this shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          mapfile -t files < <(bun scripts/test-shard.ts "$SHARD" "$TOTAL")
          [ "${#files[@]}" -gt 0 ] || { echo "shard $SHARD has no files" >&2; exit 1; }
          bun test "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/shard.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || exit "$status"
          # Bun must have run as many files as this shard listed (a count; it is what its summary reports).
          grep -Eq "across ${#files[@]} files?\." "$RUNNER_TEMP/shard.log" || { echo "bun did not report ${#files[@]} files" >&2; exit 1; }
  # The check named `test` stays, as one result for all shards: anything that waits on `test`
  # (a branch rule, a reviewer) keeps working. It fails when any shard failed or was skipped.
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests: $RESULT"
          [ "$RESULT" = success ]
  # Format, lint and typecheck run in parallel with the test shards and with each other. Each one
  # runs the tool through `bunx bun@<exact version>` (see package.json): the test shards stay on Bun
  # 1.3.4, the runtime consumers get, and these jobs only add Bun 1.4.5 (and, for lint, one canary
  # until a stable release ships `bun lint`) to the development tooling (ADR 0061). The lint and
  # typecheck jobs are ratchets: they fail when a count rises over scripts/ratchet-baseline.json.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Check the formatting
        run: bun run fmt:check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Lint, and compare with the baseline
        run: bun run lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
      - name: Typecheck, and compare with the baseline
        run: bun run check
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, by tag and digest (the digest is what Docker resolves; the tag is
      # for readers). Dependabot does not update images named inside a `run:` line: bump both by hand.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  # The packed tarball, installed the way a user installs it, in a clean Node container: first
  # without its `bun` dependency (what `--ignore-scripts` leaves is a stub) and with no Bun on
  # PATH (the launcher must exit 2 with the install line), then the real dependency from the
  # registry with only node on PATH (the launcher must run the Bun npm installed), then a Bun on
  # PATH. The image is pinned by digest (the tag is for readers); Dependabot does not bump a
  # `container:` image, so bump both by hand. The offline checks use an empty cache and a closed
  # registry port; only `--bundled-bun` and the Bun install read the registry.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Without Bun
        run: scripts/verify-package.sh --without-bun
      - name: The bundled Bun, from the registry, with only node on PATH
        run: scripts/verify-package.sh --bundled-bun
      - name: Install Bun
        run: npm install --global bun@1.3.4
      # The default check copies chalk and Clack from this checkout's node_modules.
      - name: Install the terminal-screen packages
        run: bun install --ignore-scripts
      - name: With Bun
        run: scripts/verify-package.sh
