name: Wachiman review
# Wachiman reviews its own pull requests with the last released engine, through the floating `@v1` tag
# like every other consumer: a release reviews the pull requests after it, never itself.
# The review runs when a pull request opens ready for review or leaves draft, on every push
# (`synchronize`, only the commits that are new since the last review), and on `/wachiman review`
# from the operator, like the caller templates in templates/. Save a `CLAUDE_CODE_OAUTH_TOKEN` repository secret made with `claude setup-token` (the review runs on the Claude subscription).
# Follows the floating `@v1` tag: each stable 1.x release, security fixes included, runs here
# without editing this file. A breaking change ships as v2 and needs this line edited. The cost:
# a new release runs with this repository's credentials before anyone here has read it. To hold
# one version, pin an exact tag or a full commit SHA instead.
# This caller uses `wachiman-platform.yml`, the variant that carries `id-token: write`, so each run asks the spend ledger for room before the review and records what it spent.
# When the ledger cannot be reached (a network error, a timeout, a 5xx or a 429), the review still runs under its normal budgets; a rejected token or a wrong `ledger_url` stops it instead.
on:
  pull_request: { types: [opened, ready_for_review, synchronize] }
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/wachiman-platform.yml@v1
    with:
      operator: csdev19
      model: claude-sonnet-5-5
      effort: high
      verify: false
      ledger_url: https://ledger.wachiman-api.dev
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
