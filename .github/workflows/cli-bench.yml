name: CLI bench
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # A case fails when head is more than this many percent slower than base (and at least 10 ms slower).
  # Measured on ubuntu-latest with base and head being the same commit: the median of 5 interleaved
  # rounds differed by at most 3.4% (18 case results over 3 runs), a single round by up to 14.2%.
  # 15% is above both. Revisit it after a few merged PRs.
  BENCH_THRESHOLD_PCT: "15"
  # Interleaved rounds per side, and timed runs per case within a round (scripts/cli-bench.ts --runs).
  BENCH_ROUNDS: "5"
  BENCH_RUNS: "7"
jobs:
  # Base and head run on the SAME runner, one after the other, round after round (base, head,
  # base, head, ...), so a slow minute on the machine hits both sides alike. A PR is checked out
  # as GitHub's merge commit, which is the PR on top of the base branch. Base is the event's
  # `pull_request.base.sha`. If the base branch moved before GitHub built the merge commit, head
  # also carries those newer commits, and the comparison measures them too.
  # scripts/cli-bench.ts and its fixture helper (test/support/temp-repo.ts) always come from the head
  # checkout and are copied into the base one, so both sides are measured by the same harness
  # (the base may predate it).
  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the PR replaces the run in progress, so an older run cannot overwrite the
    # comment of a newer one.
    concurrency:
      group: cli-bench-compare-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # The job goes red on a regression. It is not a required check in the repository settings
    # until the noise has been watched over several merged PRs.
    permissions:
      contents: read
      # Only to post and update the one comment of this job.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Install both sides
        run: |
          for side in base head; do
            (cd "$side" && if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi)
          done
          cp head/scripts/cli-bench.ts base/scripts/cli-bench.ts
          cp head/test/support/temp-repo.ts base/test/support/temp-repo.ts
      - name: Measure, interleaved
        id: measure
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          for round in $(seq 1 "$BENCH_ROUNDS"); do
            for side in base head; do
              (cd "$side" && bun scripts/cli-bench.ts --json --runs "$BENCH_RUNS") > "$RUNNER_TEMP/bench/$side-$round.json"
            done
          done
      - name: Compare
        id: compare
        env:
          # The head checkout is GitHub's merge commit; the table names the commit the author pushed.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd head
          set +e
          bun scripts/cli-bench-compare.ts --threshold "$BENCH_THRESHOLD_PCT" \
            --base-commit "${BASE_SHA::7}" --head-commit "${HEAD_SHA::7}" \
            --base "$RUNNER_TEMP"/bench/base-*.json --head "$RUNNER_TEMP"/bench/head-*.json \
            --out "$RUNNER_TEMP/bench/comment.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/bench/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # When an earlier step failed (install or measurement), the comment of the previous head would
      # stay and read as if it described this one: replace it with a note that names this head.
      - name: Note a failed measurement
        if: failure()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          printf '%s\n### Wachiman benchmark: base vs head\n\nThe measurement failed for head %s, so there is no comparison for it. The table of an earlier head, if any, was replaced by this note. See the job log.\n' \
            "<!-- wachiman-cli-bench -->" "${HEAD_SHA::7}" > "$RUNNER_TEMP/bench/comment.md"
          cat "$RUNNER_TEMP/bench/comment.md" >> "$GITHUB_STEP_SUMMARY"
      # One sticky comment, found by the hidden marker on its first line and by its author, so a comment someone else quotes is never patched. A pull request from a
      # fork, and one opened by Dependabot, gets a read-only token, so it only gets the job summary above.
      - name: Post or update the comment
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | (startswith("<!-- wachiman-cli-bench -->") or startswith("<!-- wachiman-bench -->")))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/bench/comment.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/bench/comment.md" > /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cli-bench-pr
          # A re-run of the job must not fail on the name the first attempt already used.
          overwrite: true
          path: ${{ runner.temp }}/bench
      - name: Fail when a case regressed
        env:
          STATUS: ${{ steps.compare.outputs.status }}
        run: |
          echo "cli-bench-compare exit status: $STATUS"
          [ "$STATUS" = 0 ]
  # The history of main: one line per merged commit in bench-history.jsonl, on the `bench-history`
  # branch (an orphan branch holding only that file). A branch needs no service and no secret,
  # is plain text that diffs and clones, and survives the 90-day expiry of workflow artifacts.
  # The same JSON is also kept as an artifact for download. Only this job can write contents.
  #
  # Each line is a controlled measurement, like a PR's: the job measures the pushed commit AND its
  # first parent on the same runner, interleaved, and stores per case the parent median, the commit
  # median and the change in percent, plus the runner identity (OS, architecture, CPU model).
  # Absolute medians from different runners differ by up to 2.5x, so they are comparable only
  # within one line; the trend to read is the per-commit change (scripts/cli-bench-history.ts).
  history:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One history job at a time, so two merges close together do not append at once. A queued run
    # is not cancelled by a running one (cancel-in-progress: false), but GitHub keeps only one
    # pending run per group, so a third merge can replace a pending second one and leave a gap.
    # A gap is harmless: every line carries its own parent measurement. The append below also
    # retries when the push is rejected, which covers a push that still races.
    concurrency:
      group: cli-bench-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Two commits deep, so the first parent is there to be measured.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: Check out the first parent
        run: |
          parent=$(git -C head rev-parse --verify --quiet HEAD^1) || { echo "the pushed commit has no parent to compare with" >&2; exit 1; }
          git -C head worktree add --detach "$PWD/base" "$parent"
      - name: Install both sides
        run: |
          for side in base head; do
            (cd "$side" && if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi)
          done
          # The same harness measures both sides, as in the compare job.
          cp head/scripts/cli-bench.ts base/scripts/cli-bench.ts
          cp head/test/support/temp-repo.ts base/test/support/temp-repo.ts
      - name: Measure, interleaved
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          for round in $(seq 1 "$BENCH_ROUNDS"); do
            for side in base head; do
              (cd "$side" && bun scripts/cli-bench.ts --json --runs "$BENCH_RUNS") > "$RUNNER_TEMP/bench/$side-$round.json"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cli-bench-main
          overwrite: true
          path: ${{ runner.temp }}/bench
      - name: Append to the bench-history branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The token goes in a header, not in the URL, so it is never written to .git/config.
          auth="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git() { command git -c "http.extraheader=$auth" "$@"; }
          url="https://github.com/${REPO}.git"
          hist="$RUNNER_TEMP/history"
          if git ls-remote --exit-code --heads "$url" bench-history > /dev/null; then
            git clone --quiet --branch bench-history --single-branch "$url" "$hist"
          else
            git init --quiet --initial-branch bench-history "$hist"
            git -C "$hist" remote add origin "$url"
          fi
          git -C "$hist" config user.name "github-actions[bot]"
          git -C "$hist" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            (cd head && bun scripts/cli-bench-history.ts --append "$hist/bench-history.jsonl" \
              --parent "$RUNNER_TEMP"/bench/base-*.json --commit "$RUNNER_TEMP"/bench/head-*.json)
            git -C "$hist" add bench-history.jsonl
            if git -C "$hist" diff --cached --quiet; then echo "commit already recorded"; exit 0; fi
            git -C "$hist" commit --quiet -m "bench: ${GITHUB_SHA::7}"
            git -C "$hist" push --quiet origin bench-history && exit 0
            # Someone else pushed first: start again from the new tip.
            git -C "$hist" fetch --quiet origin bench-history
            git -C "$hist" reset --quiet --hard origin/bench-history
          done
          echo "could not push the history" >&2
          exit 1
