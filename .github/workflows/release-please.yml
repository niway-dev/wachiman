name: Release Please

# Maintains one release PR (version bump in package.json + CHANGELOG.md) from Conventional
# Commits on main. Merging it creates the exact tag vX.Y.Z and a GitHub Release. Then the
# last step moves the floating major tag (v1) to the release commit.
# When it cuts a release, the same run then verifies the tagged commit and publishes the package
# to npm (jobs `verify` and `publish` below). That lives in this workflow on purpose: a workflow
# cannot `needs:` a job of another file, and a tag created with GITHUB_TOKEN does not start a
# workflow on `push: tags`, so a separate release workflow would not run when the PAT is missing.
# See docs/releasing.md ("Publishing to npm").

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  # Never cancel a half-finished release cut; queue instead.
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    # The release tokens live in the `production` environment, as in the maintainer's other
    # repositories, so the job must declare it to read them. This workflow only runs on pushes
    # to main; keep the environment's deployment branch policy allowing main, and do not add
    # required reviewers to it, or every release cut would wait for a manual approval.
    environment: production
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A PAT lets the release PR trigger CI (GITHUB_TOKEN events do not start workflows).
          # Falls back to GITHUB_TOKEN so the release PR still opens before the secret exists,
          # but without CI running on it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Moves the floating major tag (v1) to the release commit. The `v*` tag ruleset forbids
      # updates except by repository admins, so GITHUB_TOKEN cannot do it: RELEASE_TAG_TOKEN is
      # a fine-grained PAT of an admin. Without it, or if the push fails, the step only warns and
      # prints the commands, so the release itself never fails because of the alias.
      # Pre-releases (tag with a hyphen, such as v1.0.0-rc.2) never move the alias.
      - name: Move the floating major tag
        if: ${{ steps.rp.outputs.release_created == 'true' && !contains(steps.rp.outputs.tag_name, '-') }}
        env:
          # One secret is enough: RELEASE_PLEASE_TOKEN moves the alias too. RELEASE_TAG_TOKEN is an
          # optional override for owners who want a separate, narrower token for tag moves.
          TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          MAJOR_TAG: v${{ steps.rp.outputs.major }}
          RELEASE_TAG: ${{ steps.rp.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.rp.outputs.sha }}
        run: |
          set -uo pipefail
          manual="git tag -f ${MAJOR_TAG} ${RELEASE_SHA} && git push -f origin ${MAJOR_TAG}"
          warn() {
            echo "::warning title=Floating tag ${MAJOR_TAG} not moved::$1"
            {
              echo "### Floating tag \`${MAJOR_TAG}\` was NOT moved"
              echo "$1"
              echo
              echo "Run as a repository admin:"
              echo '```sh'
              echo "$manual"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -z "${TAG_TOKEN}" ]; then
            warn "Neither RELEASE_TAG_TOKEN nor RELEASE_PLEASE_TOKEN is set, so ${RELEASE_TAG} was released but the alias stayed where it was."
            exit 0
          fi
          git init -q alias && cd alias
          git remote add origin "https://x-access-token:${TAG_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth=1 origin "${RELEASE_SHA}" \
            && git -c advice.detachedHead=false checkout -q "${RELEASE_SHA}" \
            && git tag -f "${MAJOR_TAG}" "${RELEASE_SHA}" \
            && git push -f origin "refs/tags/${MAJOR_TAG}"; then
            echo "${MAJOR_TAG} now points to ${RELEASE_SHA} (${RELEASE_TAG})" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            warn "Pushing ${MAJOR_TAG} failed (token expired, missing contents: write, or the account is not a ruleset bypass actor)."
          fi

  # Verifies the tagged commit and packs the tarball that `publish` uploads, byte for byte.
  verify:
    name: Verify the tagged commit
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          # The full history: the connector parity test (test/parity.test.ts) needs the recorded commits.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: The checked-out commit is the one release-please tagged
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./package.json').name")" = "wachiman"
      - run: bun test
      - name: Pack the tarball
        run: |
          mkdir dist
          npm pack --pack-destination dist --ignore-scripts
      - name: Install the exact tarball, with Bun and without
        run: |
          tarball="$(ls dist/wachiman-*.tgz)"
          scripts/verify-package.sh --tarball "$tarball" --without-bun
          scripts/verify-package.sh --tarball "$tarball"
          sha256sum "$tarball" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wachiman-tarball
          path: dist/wachiman-*.tgz
          if-no-files-found: error
          retention-days: 30

  # The only job with publishing authority. npm trusted publishing: the registry accepts this
  # workflow's OpenID Connect identity, so there is no NPM_TOKEN secret anywhere, and the
  # provenance statement names this workflow run and the tagged commit.
  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named in the package's trusted-publisher settings on npmjs.com (docs/releasing.md).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wachiman-tarball
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" is older than 11.5.1"); process.exit(1); }' "$(npm --version)"
      - name: Publish the verified tarball
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          tarball="$(ls dist/wachiman-*.tgz)"
          test "$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = "$EXPECTED_VERSION"
          tag=latest
          case "$EXPECTED_VERSION" in *-*) tag=next ;; esac
          sha256sum "$tarball" | tee -a "$GITHUB_STEP_SUMMARY"
          npm publish "$tarball" --provenance --access public --tag "$tag"

  # The Windows executable, in two jobs so that the one that runs code has no write authority and
  # the one that writes has run no repository code (ADR 0028 decision 3). This one builds on the
  # tagged commit with the pinned Bun, runs the smoke rows against the result and hands over the
  # file with its SHA-256. It starts only when `verify` passed, as `publish` does.
  windows-exe:
    name: Build and smoke-test wachiman.exe
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - name: The checked-out commit is the one release-please tagged
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(bun -p "require('./package.json').version")" = "$EXPECTED_VERSION"
      - name: Build wachiman.exe with the dotenv and bunfig autoload off
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bun scripts/build-exe.ts --outfile dist/wachiman.exe --target bun-windows-x64 --version "$VERSION"
      - name: "Smoke rows W1, W2, W3 and W6"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$VERSION" --rows W1,W2,W3,W6
      - name: "Smoke row W5: Ctrl-C"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bun scripts/smoke-exe.ts --exe dist/wachiman.exe --version "$VERSION" --rows W5
      - name: SHA-256
        run: |
          cd dist
          sha256sum wachiman.exe > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wachiman-exe
          path: |
            dist/wachiman.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The only job that writes to the release: it attests the exact bytes that passed the smoke rows
  # and attaches them with their SHA-256. It checks out nothing and runs no repository code.
  windows-exe-release:
    name: Attest and attach wachiman.exe
    needs: [release-please, windows-exe]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wachiman-exe
          path: dist
      - name: The artifact arrived intact and holds only the executable and its checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(find . -type f | sort | tr '\n' ' ')" = "./SHA256SUMS ./wachiman.exe "
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/wachiman.exe
      - name: Attach to the release and state the tier in its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/wachiman.exe dist/SHA256SUMS --repo "$REPO" --clobber
          # The notes say what the executable is, once: a compiled build is not a supported platform.
          notes="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          marker="Windows executable (built and smoke-tested)"
          case "$notes" in
            *"$marker"*) ;;
            *) gh release edit "$TAG" --repo "$REPO" --notes "$notes

          **$marker:** \`wachiman.exe\` is attached with \`SHA256SUMS\` and a build attestation (\`gh attestation verify wachiman.exe --repo $REPO\`). It was built and run against a fake \`claude\` on Windows; Windows is not a supported platform yet, and WSL is the supported path meanwhile." ;;
          esac
