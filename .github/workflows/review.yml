name: Agent review (reusable)

# Reusable workflow: an advisory review of a pull request, paid from the caller's own API key.
# Call it from a short caller file (templates/agent-review-caller.yml); see docs/install.md.
# The review is never a required check, an approval, a change request or a merge gate.
#
# What the consumer must trust (see SECURITY.md and docs/adr/0001-distribution-and-trust.md):
#   - Everyone who can push a branch to the calling repository. On `pull_request` GitHub runs
#     the caller file from the pull request's own merge commit, so a person who can push can
#     edit the caller and read `ANTHROPIC_API_KEY`. Nothing here defends against that.
#   - The ref of this workflow that the caller pins. A floating tag such as `v1` is a trust
#     dependency on this repository's maintainers; pin a full commit SHA for immutability.
#
# What this workflow does about it:
#   - Fork pull requests are excluded (they get no secrets anyway), and the on-demand path
#     re-checks that the head belongs to the calling repository before it runs anything.
#   - `pull_request_target` is not used and must not be added to the caller.
#   - Only the `operator` login can start an on-demand run, and the jobs fail early when
#     `operator` is empty or still a template placeholder.
#   - The reviewed head is data: it is checked out without credentials into `head/`, and the
#     engine that holds the key comes from this repository at the version of this workflow into
#     `engine/`, never from the head. Bun runs inside `engine/` with `--no-env-file` and the
#     engine's own `bunfig.toml`, so a `bunfig.toml` (whose `preload` runs code) or a `.env` in
#     the head is never read; the head's path is passed with `--repo-dir`. The agent gets an
#     allowlisted environment (docs/providers/claude-code.md). The engine launches Claude Code with `--restricted --strict-mcp-config
#     --tools Read,Glob,Grep` and its own settings, so the head's `.claude/` settings and hooks
#     are blocked, no MCP server starts and only read tools exist. That is not a sandbox: it is
#     claimed only for what tests show.
#   - Budgets and batch sizes come from the caller's `with:` values, never from the pull request.

on:
  workflow_call:
    inputs:
      operator:
        description: GitHub login allowed to start on-demand runs by comment
        type: string
        required: true
      mention:
        description: Command that starts an on-demand run (`@agent-review` and `@claude` are always accepted too)
        type: string
        default: "/wachi"
      budget_usd:
        description: Most one pull request review may spend, in USD
        type: number
        default: 3
      batch_budget_usd:
        description: Most one batch may spend, in USD
        type: number
        default: 0.75
      answer_budget_usd:
        description: Most one on-demand question may spend, in USD
        type: number
        default: 1
      batch_lines:
        description: Changed lines per batch
        type: number
        default: 1000
      batch_chars:
        description: Diff characters per batch
        type: number
        default: 140000
      model:
        description: Model the agent uses
        type: string
        default: claude-sonnet-5-5
      effort:
        description: Reasoning effort the model runs at (low, medium, high, xhigh or max); printed in every review footer
        type: string
        default: high
      max_turns:
        description: Most agent turns one call may take (Claude Code --max-turns); a call that reaches it is reported, and its files are retried once
        type: number
        default: 40
      call_timeout_s:
        description: Wall-clock seconds one call may run before it is killed; keep it well under the 30 minute job limit
        type: number
        default: 900
      provider:
        description: Agent provider; only claude-code exists
        type: string
        default: claude-code
      claude_code_version:
        description: Pinned Claude Code version
        type: string
        default: 2.1.304
      claude_code_sha256:
        description: >-
          Optional SHA-256 of the Claude Code binary for the runner's platform (linux-x64 on
          ubuntu-latest). Empty means the hash is read from the publisher's manifest.
        type: string
        default: ""
      bun_version:
        description: Pinned Bun version
        type: string
        default: 1.3.4
      skip_branch_prefixes:
        description: Comma-separated head branch prefixes whose pull requests are not reviewed
        type: string
        default: release-please--
      review_on_push:
        description: >-
          Review every push to an open pull request, only the new commits (the caller must list
          `synchronize` in its `pull_request` types). A push can spend up to `budget_usd`; set
          false to review only on open, ready for review and `/wachi review`.
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key that pays for the review
        required: true

# Concurrency is per job, never per workflow: every comment on a pull request starts a run,
# and a workflow-level group would let a skipped `on-demand` cancel a review.

jobs:
  review:
    name: Agent review
    # Fork and Dependabot pull requests get no secrets, so the job could only fail there.
    # The skipped branch prefixes are checked in the first step (a prefix list cannot be
    # matched in an expression). These conditions hold for every `pull_request` action, so a
    # push (`synchronize`) to a draft, a fork or a skipped branch is skipped like an open is.
    # `review_on_push: false` skips the push runs; the trigger itself lives in the caller.
    # A burst of pushes runs once: the concurrency group below cancels the older run.
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action != 'synchronize' || inputs.review_on_push) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # batches run one after another
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the operator input
        env:
          OPERATOR: ${{ inputs.operator }}
        run: |
          op="${OPERATOR//[[:space:]]/}"
          lower="${op,,}"
          if [ -z "$op" ] || [[ "$lower" == edit* ]] || [ "$lower" = "your-github-login" ]; then
            echo "::error title=operator is not set::The workflow input 'operator' is empty or still a template placeholder ('$op'). Set it to your GitHub login in the caller workflow. A placeholder can be registered by anyone and would make them the operator."
            exit 1
          fi

      - name: Skip branches that are not reviewed
        id: gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          PREFIXES: ${{ inputs.skip_branch_prefixes }}
        run: |
          IFS=',' read -ra list <<< "$PREFIXES"
          for p in "${list[@]}"; do
            p="${p// /}"
            if [ -n "$p" ] && [[ "$HEAD_REF" == "$p"* ]]; then
              echo "Branch $HEAD_REF matches skipped prefix $p; not reviewing."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # The head, not the default merge commit, so the files match the diff's lines. It is
      # data: it goes into `head/`, a sibling of the engine's `engine/`, no credentials stay in
      # its .git, and the engine never runs with it as its working directory, so Bun reads no
      # `bunfig.toml` or `.env` from it.
      - name: Checkout the pull request head
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          persist-credentials: false

      # In a reusable workflow, `github.workflow_sha` and `github.workflow_ref` describe the
      # caller's workflow, not this one. The `job` context describes the workflow file that
      # defines the job, and the GitHub docs use exactly these two properties to check out a
      # reusable workflow's own source:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      # So the engine version always equals the version of this workflow that was called.
      - name: Checkout the engine at this workflow's version
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Record the engine version
        if: steps.gate.outputs.skip != 'true'
        env:
          ENGINE_REPO: ${{ job.workflow_repository }}
          ENGINE_SHA: ${{ job.workflow_sha }}
        run: |
          echo "Engine $ENGINE_REPO@$ENGINE_SHA, run from engine/ with --no-env-file and its own bunfig.toml." >> "$GITHUB_STEP_SUMMARY"
          echo "The reviewed head is in head/ and is read as data: its bunfig.toml and .env are never loaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        if: steps.gate.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install Claude Code
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CLAUDE_CODE_SHA256: ${{ inputs.claude_code_sha256 }}
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-bin
        # Downloads the pinned binary and fails the job unless its SHA-256 matches. With no
        # `claude_code_sha256` the expected hash comes from the publisher's manifest, which
        # proves integrity against the publisher, not against a compromised publisher; pass
        # the input to pin the hash independently. See docs/providers/claude-code.md.
        run: |
          bash engine/src/install-claude-code.sh
          echo "$CLAUDE_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Review the pull request
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENT_REVIEW_BUDGET_USD: ${{ inputs.budget_usd }}
          AGENT_REVIEW_BATCH_BUDGET_USD: ${{ inputs.batch_budget_usd }}
          AGENT_REVIEW_ANSWER_BUDGET_USD: ${{ inputs.answer_budget_usd }}
          AGENT_REVIEW_BATCH_LINES: ${{ inputs.batch_lines }}
          AGENT_REVIEW_BATCH_CHARS: ${{ inputs.batch_chars }}
          AGENT_REVIEW_MODEL: ${{ inputs.model }}
          AGENT_REVIEW_EFFORT: ${{ inputs.effort }}
          AGENT_REVIEW_MAX_TURNS: ${{ inputs.max_turns }}
          AGENT_REVIEW_CALL_TIMEOUT_S: ${{ inputs.call_timeout_s }}
          AGENT_REVIEW_PROVIDER: ${{ inputs.provider }}
          AGENT_REVIEW_MENTION: ${{ inputs.mention }}
          AGENT_REVIEW_OPERATOR: ${{ inputs.operator }}
        # Bun's working directory is `engine/`, which this repository owns. `--config=<path>`
        # needs the equals sign: `-c <path>` did not replace the head's config in Bun 1.3.4.
        working-directory: engine
        run: bun --no-env-file --config=bunfig.toml src/cli.ts review "$PR" --repo-dir "$GITHUB_WORKSPACE/head"

  on-demand:
    name: Agent on demand
    # Only the operator's login starts a run: `author_association` is `OWNER` for a
    # user-owned repository but `MEMBER` in an organisation, so the login is compared.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == inputs.operator &&
      (contains(github.event.comment.body, inputs.mention) ||
       contains(github.event.comment.body, '@agent-review') ||
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30 # batches run one after another
    concurrency:
      group: agent-review-on-demand-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      # The `if:` above cannot fail loudly, so a placeholder operator is refused here as well.
      - name: Check the operator input
        env:
          OPERATOR: ${{ inputs.operator }}
        run: |
          op="${OPERATOR//[[:space:]]/}"
          lower="${op,,}"
          if [ -z "$op" ] || [[ "$lower" == edit* ]] || [ "$lower" = "your-github-login" ]; then
            echo "::error title=operator is not set::The workflow input 'operator' is empty or still a template placeholder ('$op'). Set it to your GitHub login in the caller workflow. A placeholder can be registered by anyone and would make them the operator."
            exit 1
          fi

      # `issue_comment` carries no head repository, so check it before anything reads the
      # head: on a fork's pull request the job stops instead of running its code with the key.
      - name: Refuse a fork pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "Pull request #$PR comes from $head, not $GITHUB_REPOSITORY; not running." >&2
            exit 1
          fi

      # The head is data, as in the `review` job: it goes into `head/`.
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: head
          fetch-depth: 1
          persist-credentials: false

      # See the `review` job for why this is `job.workflow_sha` and not `github.workflow_sha`.
      - name: Checkout the engine at this workflow's version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Record the engine version
        env:
          ENGINE_REPO: ${{ job.workflow_repository }}
          ENGINE_SHA: ${{ job.workflow_sha }}
        run: |
          echo "Engine $ENGINE_REPO@$ENGINE_SHA, run from engine/ with --no-env-file and its own bunfig.toml." >> "$GITHUB_STEP_SUMMARY"
          echo "The reviewed head is in head/ and is read as data: its bunfig.toml and .env are never loaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CLAUDE_CODE_SHA256: ${{ inputs.claude_code_sha256 }}
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-bin
        # Downloads the pinned binary and fails the job unless its SHA-256 matches. With no
        # `claude_code_sha256` the expected hash comes from the publisher's manifest, which
        # proves integrity against the publisher, not against a compromised publisher; pass
        # the input to pin the hash independently. See docs/providers/claude-code.md.
        run: |
          bash engine/src/install-claude-code.sh
          echo "$CLAUDE_INSTALL_DIR" >> "$GITHUB_PATH"

      # The comment reaches the engine through the environment, never interpolated into the
      # shell, so its text cannot run as a command.
      - name: Review or answer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          REQUEST: ${{ github.event.comment.body }}
          AGENT_REVIEW_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AGENT_REVIEW_BUDGET_USD: ${{ inputs.budget_usd }}
          AGENT_REVIEW_BATCH_BUDGET_USD: ${{ inputs.batch_budget_usd }}
          AGENT_REVIEW_ANSWER_BUDGET_USD: ${{ inputs.answer_budget_usd }}
          AGENT_REVIEW_BATCH_LINES: ${{ inputs.batch_lines }}
          AGENT_REVIEW_BATCH_CHARS: ${{ inputs.batch_chars }}
          AGENT_REVIEW_MODEL: ${{ inputs.model }}
          AGENT_REVIEW_EFFORT: ${{ inputs.effort }}
          AGENT_REVIEW_MAX_TURNS: ${{ inputs.max_turns }}
          AGENT_REVIEW_CALL_TIMEOUT_S: ${{ inputs.call_timeout_s }}
          AGENT_REVIEW_PROVIDER: ${{ inputs.provider }}
          AGENT_REVIEW_MENTION: ${{ inputs.mention }}
          AGENT_REVIEW_OPERATOR: ${{ inputs.operator }}
        # Bun's working directory is `engine/`; see the `review` job.
        working-directory: engine
        run: bun --no-env-file --config=bunfig.toml src/cli.ts comment "$PR" --repo-dir "$GITHUB_WORKSPACE/head"
