<svg viewBox="0 0 728 1010" width="728" height="1010" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<!-- How one Wachiman review run flows. Hand-written SVG; the source of truth is docs/architecture.md. -->
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
<style>
.box{fill:#fff;stroke:#999;stroke-width:1.2;rx:8}
.loop{fill:none;stroke:#999;stroke-dasharray:6 4;stroke-width:1.2;rx:12}
.t{font-size:13px;font-weight:700;fill:#1f2328}
.s{font-size:11px;fill:#5b5b55}
.mt{font-size:13px;font-weight:700;fill:#1e3a8a}
.ms{font-size:11px;fill:#1f2937}
.lbl{font-size:11px;font-weight:600;fill:#1f2328}
.e{font-size:10.5px;fill:#5b5b55}
.a{stroke:#444;stroke-width:1.6;fill:none;marker-end:url(#m)}
.model{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.6;rx:8}
.grey{fill:#e5e7eb}.amber{fill:#fde68a}.blue{fill:#bfdbfe}.green{fill:#bbf7d0}
</style></defs>
<rect width="728" height="1010" fill="#fafaf7"/>
<rect x="16" y="10" width="110" height="18" rx="9" class="grey"/><text x="71" y="23" text-anchor="middle" class="lbl">JSON · engine only</text>
<rect x="134" y="10" width="150" height="18" rx="9" class="blue"/><text x="209" y="23" text-anchor="middle" class="lbl">Markdown+XML · prompt</text>
<rect x="292" y="10" width="170" height="18" rx="9" class="amber"/><text x="377" y="23" text-anchor="middle" class="lbl">JSON · the model opens it</text>
<rect x="470" y="10" width="140" height="18" rx="9" class="green"/><text x="540" y="23" text-anchor="middle" class="lbl">JSON · from the model</text>
<rect x="24" y="48" width="200" height="56" class="box"/>
<text x="124" y="70" text-anchor="middle" class="t">PR opened / push</text>
<text x="124" y="88" text-anchor="middle" class="s">GitHub Actions · review job</text>
<rect x="264" y="48" width="200" height="56" class="box"/>
<text x="364" y="70" text-anchor="middle" class="t">/wachiman review</text>
<text x="364" y="88" text-anchor="middle" class="s">operator comment</text>
<rect x="504" y="48" width="200" height="56" class="box"/>
<text x="604" y="70" text-anchor="middle" class="t">wachiman local</text>
<text x="604" y="88" text-anchor="middle" class="s">laptop · git · subscription</text>
<path class="a" d="M124,104 L124,124 L364,124 L364,146"/>
<path class="a" d="M364,104 L364,146"/>
<path class="a" d="M604,104 L604,124 L364,124"/>
<rect x="164" y="148" width="400" height="86" class="box"/>
<text x="364" y="170" text-anchor="middle" class="t">Connector: builds the input</text>
<text x="364" y="190" text-anchor="middle" class="s">files + diff · what changed since the last review? (marker)</text>
<text x="364" y="206" text-anchor="middle" class="s">rules read from the BASE commit · open threads · per-PR spend ceiling</text>
<rect x="282" y="214" width="164" height="16" rx="8" class="grey"/><text x="364" y="226" text-anchor="middle" class="lbl">ReviewInput · never to the model</text>
<path class="a" d="M364,234 L364,262"/>
<rect x="164" y="264" width="400" height="64" class="box"/>
<text x="364" y="286" text-anchor="middle" class="t">Core: filter → risk score → plan batches</text>
<text x="364" y="304" text-anchor="middle" class="s">drop lockfiles and generated files · weight by path (workflows 8 … docs 1)</text>
<text x="364" y="318" text-anchor="middle" class="s">modules together, line and char caps per batch, riskiest first</text>
<path class="a" d="M364,328 L364,356"/>
<rect x="24" y="358" width="680" height="396" class="loop"/>
<text x="40" y="378" class="s" font-weight="700">PER BATCH · riskiest first · until the budget runs out</text>
<rect x="44" y="392" width="230" height="78" class="box"/>
<text x="159" y="412" text-anchor="middle" class="t">Evidence + questions</text>
<text x="159" y="428" text-anchor="middle" class="s">git grep of ≤12 called names</text>
<text x="159" y="442" text-anchor="middle" class="s">→ sibling call sites</text>
<text x="159" y="456" text-anchor="middle" class="s">regex → data-path questions</text>
<rect x="44" y="486" width="230" height="56" class="box"/>
<text x="159" y="506" text-anchor="middle" class="t">Side files</text>
<rect x="60" y="516" width="198" height="16" rx="8" class="amber"/><text x="159" y="528" text-anchor="middle" class="lbl">pr.json · threads.json · evidence.json</text>
<path class="a" d="M159,470 L159,484"/>
<rect x="44" y="560" width="230" height="86" class="box"/>
<text x="159" y="580" text-anchor="middle" class="t">buildBatchPrompt</text>
<text x="159" y="596" text-anchor="middle" class="s">rules · questions · repository instructions</text>
<text x="159" y="610" text-anchor="middle" class="s">+ &lt;diff&gt; with a line number on every row</text>
<rect x="88" y="620" width="142" height="16" rx="8" class="blue"/><text x="159" y="632" text-anchor="middle" class="lbl">Markdown + XML · stdin</text>
<path class="a" d="M159,542 L159,558"/>
<path class="a" d="M274,603 L306,603"/>
<rect x="308" y="520" width="190" height="166" class="model"/>
<text x="403" y="544" text-anchor="middle" class="mt">THE MODEL</text>
<text x="403" y="560" text-anchor="middle" class="ms">the only part that judges</text>
<text x="403" y="582" text-anchor="middle" class="ms">claude -p · Read/Glob/Grep only</text>
<text x="403" y="596" text-anchor="middle" class="ms">no shell, no GH_TOKEN</text>
<text x="403" y="610" text-anchor="middle" class="ms">$ cap per call (soft)</text>
<text x="403" y="630" text-anchor="middle" class="ms">reads whole files and callers</text>
<text x="403" y="644" text-anchor="middle" class="ms">the engine cannot see what it read</text>
<rect x="326" y="656" width="154" height="16" rx="8" class="green"/><text x="403" y="668" text-anchor="middle" class="lbl">JSON output by schema</text>
<path class="a" d="M274,514 L300,514 L300,520"/>
<text x="286" y="508" class="e">opens</text>
<path class="a" d="M498,603 L530,603"/>
<rect x="532" y="520" width="156" height="166" class="box"/>
<text x="610" y="544" text-anchor="middle" class="t">Verification</text>
<text x="610" y="566" text-anchor="middle" class="s">relative paths</text>
<text x="610" y="580" text-anchor="middle" class="s">valid confidence</text>
<text x="610" y="594" text-anchor="middle" class="s">cites exist in the head</text>
<text x="610" y="616" text-anchor="middle" class="s">did it list every file?</text>
<text x="610" y="630" text-anchor="middle" class="s">missing → one retry</text>
<text x="610" y="644" text-anchor="middle" class="s">with those files only</text>
<text x="610" y="666" text-anchor="middle" class="s">adds up spend · &lt;$0.05 → stop</text>
<path class="a" d="M610,686 L610,712 L159,712 L159,648"/>
<text x="384" y="707" text-anchor="middle" class="e">retry (once) / next batch</text>
<path class="a" d="M364,754 L364,782"/>
<rect x="164" y="784" width="400" height="72" class="box"/>
<text x="364" y="806" text-anchor="middle" class="t">Merge batches</text>
<text x="364" y="824" text-anchor="middle" class="s">dedupe by path+line+topic · low confidence at Blocker/Fix → question · anchor inline or not</text>
<rect x="268" y="834" width="192" height="16" rx="8" class="grey"/><text x="364" y="846" text-anchor="middle" class="lbl">ReviewResult · never to the model</text>
<path class="a" d="M264,856 L264,878 L164,878 L164,896"/>
<path class="a" d="M464,856 L464,878 L564,878 L564,896"/>
<rect x="24" y="898" width="280" height="96" class="box"/>
<text x="164" y="920" text-anchor="middle" class="t">GitHub: review COMMENT</text>
<text x="164" y="938" text-anchor="middle" class="s">escapes the model's &lt;!-- --&gt; · own signature</text>
<text x="164" y="952" text-anchor="middle" class="s">aborts if anything looks like an API key</text>
<text x="164" y="966" text-anchor="middle" class="s">never approves or requests changes</text>
<text x="164" y="980" text-anchor="middle" class="s">marker for the next incremental review</text>
<rect x="424" y="898" width="280" height="96" class="box"/>
<text x="564" y="920" text-anchor="middle" class="t">Local: terminal / Markdown / JSON</text>
<text x="564" y="938" text-anchor="middle" class="s">same ReviewResult</text>
<text x="564" y="952" text-anchor="middle" class="s">--history: compares with earlier runs</text>
<text x="564" y="966" text-anchor="middle" class="s">new / persisting / gone</text>
<text x="564" y="980" text-anchor="middle" class="s">never leaves the machine</text>
</svg>
