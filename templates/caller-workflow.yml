name: Wachiman review

# An advisory code review by an agent CLI (today Claude Code), paid from the Anthropic Console
# API credits through the `ANTHROPIC_API_KEY` secret. It is a GitHub review: each finding is a comment on its
# line, labelled with a severity and a topic (for example "🟠📝 Fix · docs"), that the owner can
# answer in its thread; information that needs no reply goes in the review body. It is
# advisory: never a required check, never an approval or a change request, never a merge
# gate. What to look for beyond the defaults is in `.github/wachiman.md`.
#
# The "copy the files" workflow template. Copy it with the `src/` folder of niway-dev/wachiman
# (as `scripts/agent-review/`, see docs/setup-copy.md), record the decision in the repository's ADRs, and edit the
# trust paragraph below to say who can push. It runs narrowly:
#   - `review`: when a pull request opens ready for review or leaves draft, and on every later
#     push (`synchronize`), which reviews only the commits that are new since the last review.
#     A rebase with no change in content posts a one-line marker and calls no model. Each push
#     can spend up to AGENT_REVIEW_BUDGET_USD, and all automatic runs on one pull request
#     together up to AGENT_REVIEW_AUTO_BUDGET_USD (`/wachiman review` is not limited by it); to
#     review only on open and on `/wachiman review`, remove `synchronize` from the `pull_request`
#     types below.
#   - `threads`: when the repository owner replies in a review thread (a
#     `pull_request_review_comment`), Wachiman answers every thread that waits for an answer,
#     with no review and no resolve, but only once the pull request's head was already reviewed
#     (otherwise the review of the push reads the replies). A new line comment in the review panel
#     that asks a question after the command word is answered under itself. Remove the
#     `pull_request_review_comment` trigger below to turn it off.
#   - `on-demand`: when the repository owner comments on a pull request:
#     `/wachiman review` re-reviews what changed since the last complete, unscoped review and,
#     when that review has work to do, answers the owner's replies in the open threads;
#     `/wachiman review <path>…` reviews only those paths; any other `/wachiman …` comment is a
#     question, answered as a comment.
#
# Limit of this install: the copied engine lives in the consumer repository itself, so engine and
# reviewed head cannot be fully separated here (on `pull_request` the engine is the pull request's
# own copy, and the checkout is the process's working directory). The reusable workflow
# (templates/wachiman-review-caller.yml) checks them out as siblings and is preferred; to move
# an existing copy there, see docs/setup-copy.md. This copy
# still runs `bun --no-env-file --config=scripts/agent-review/bunfig.toml ... --repo-dir .`, so
# Bun reads no `bunfig.toml` or `.env` from the head; copy `bunfig.toml` next to `cli.ts`.
#
# Before the agent is called, `scripts/agent-review/cli.ts` drops lockfiles, build output and
# generated files, then packs the rest into batches of about 1,000 changed lines, riskiest
# first, one agent call each with its diff inside the prompt. A batch that leaves files
# unaccounted for is re-run once with only those files. A pull request whose estimate is above
# the size gate is skipped with one comment. Otherwise the budgets
# below limit each run (Claude Code's per-call limit is a soft cap that can be exceeded; see
# docs/providers/claude-code.md), and a file still not accounted for marks the review
# "partial" on its first line.
#
# Comments come from `github-actions[bot]` through the workflow token, so no GitHub
# App needs to be installed.
#
# Both jobs run `scripts/agent-review/cli.ts`: the agent only reads (files, the PR, its diff),
# and the CLI posts the review, within the budgets below. That is enough
# here because only the owner pushes (EDIT THIS: say who can open pull requests in this
# repository), so everything the agent reads is trusted. A public repository needs more
# before copying this file: prompt injection and outside contributors. Three things
# already keep strangers out: fork pull requests are skipped (they get no secrets anyway),
# only the operator's `/wachiman` comment starts a run, and only replies from people with
# access reach the agent. Claude Code runs with `--restricted --strict-mcp-config
# --tools Read,Glob,Grep --settings claude-code.settings.json` (docs/providers/claude-code.md):
# the head's user, project and local settings (its `.claude/` hooks included) are ignored,
# no MCP server starts, and only read tools exist. Managed settings and the adapter's own
# settings still apply. Not verified: whether the
# head's `CLAUDE.md` still loads as memory, and whether the `/proc` deny rules matter under
# `--restricted`. Still not a sandbox: the trust assumption stays what makes this acceptable.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  # GitHub runs `issue_comment` workflows from the default branch's copy of this file. The
  # pull request that installs the workflow therefore gets only the `pull_request` review;
  # `/wachiman review` starts working once the file is on the default branch. A reply in a review
  # thread starts no run by itself.
  issue_comment:
    types: [created]
  # A reply in a review thread. Like `pull_request`, it runs from the pull request's own copy of
  # this file, with secrets for a same-repository head.
  pull_request_review_comment:
    types: [created]

# Claude Code runs directly rather than through anthropics/claude-code-action: in one
# setup the action's first API call failed with `billing_error` while `claude -p`, with the
# same key, version and runner, succeeded.
#
# Concurrency is per job, never per workflow: every comment on a pull request starts a
# run, and a workflow-level group would let a skipped `on-demand` cancel a review.

env:
  # Pinned: the version is part of what was verified to work (see above). Bump it by
  # hand, and re-run a review to check.
  CLAUDE_CODE_VERSION: 2.1.304
  # Batch size, and the limits on one batch, one pull request and one `/wachiman` question (soft
  # caps per call, not a guaranteed ceiling). Past the pull request's budget the remaining
  # batches are listed as not reviewed.
  # A pull request edits these for its own `review` run, which the trust assumption above
  # accepts.
  AGENT_REVIEW_BATCH_LINES: 1000
  AGENT_REVIEW_BATCH_BUDGET_USD: 0.75
  AGENT_REVIEW_BUDGET_USD: 3
  # The most all automatic runs on one pull request (first review, push reviews, thread replies)
  # may spend together; the engine sums it from its own signed review footers. `/wachiman review`
  # is not limited by it. A thread-reply run has its own cap, inside this one.
  AGENT_REVIEW_AUTO_BUDGET_USD: 2
  # A review whose estimate (from the diff size, before any model call) is above this is skipped
  # with one comment. It is never below what the run may spend, so raising the budgets lifts it.
  AGENT_REVIEW_SIZE_GATE_USD: 6
  AGENT_REVIEW_THREADS_BUDGET_USD: 0.25
  AGENT_REVIEW_ANSWER_BUDGET_USD: 1
  # Who may ask a question by comment: `operator` (only the operator) or `write` (also a collaborator
  # with admin, maintain or write permission). Set it to `write` together with the literal
  # `'operator' == 'write'` in the `threads` and `on-demand` `if:` below (EDIT THIS), since a job
  # `if:` cannot read this variable.
  AGENT_REVIEW_ASKERS: operator
  # The most all questions from people other than the operator may spend on one pull request.
  AGENT_REVIEW_ASK_CEILING_USD: 3
  # The login allowed to command the tool (EDIT THIS). The `on-demand` job `if:` checks the same
  # login, and the CLI checks it again against the comment's author.
  AGENT_REVIEW_OPERATOR: your-github-login
  # Seconds a push (`synchronize`) waits before any model call. A newer push cancels this run
  # while it sleeps (the `review` job's concurrency group), so it spends nothing. Only pushes
  # wait; `opened` and `ready_for_review` start at once. `0` disables the wait. The wait counts
  # toward the job's 30 minute limit.
  AGENT_REVIEW_PUSH_DEBOUNCE_SECONDS: 180
  # Trial. PR Confidence: after a full review of a pull request, one more small model call grades
  # whether the diff does what the title and body say, and writes it into the pull request
  # description. Each push first resets it to "cannot say", and a push after the first review is
  # reviewed incrementally, which is not graded, so it stays "cannot say" until a review of the whole
  # pull request runs. Not an approval or a check. `1` turns it on. See docs/pr-confidence.md
  AGENT_REVIEW_CONFIDENCE: 0

jobs:
  review:
    name: Wachiman review
    # Fork and Dependabot pull requests get no secrets, so the job could only fail there.
    # Release-please pull requests are a changelog and a version bump; reviewing them would
    # only spend.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 30 # batches run one after another
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The head, not the default merge commit, so the files match the diff's lines.
      - name: Checkout the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # PR Confidence: before the push wait and with no model call, the description block becomes
      # "cannot say" for the commit under review, so a run that a newer push cancels during the wait
      # leaves no grade of an older commit. The command does nothing when AGENT_REVIEW_CONFIDENCE is
      # off, so no condition on it is needed here. Best-effort: it never stops the review.
      - name: Reset PR Confidence for this commit
        if: github.event.action == 'synchronize'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun --no-env-file --config=scripts/agent-review/bunfig.toml scripts/agent-review/cli.ts reset-confidence "$PR" --commit "$HEAD_SHA"

      # Before any model call: a run cancelled here has spent nothing.
      - name: Wait for further pushes
        if: github.event.action == 'synchronize'
        run: |
          seconds="${AGENT_REVIEW_PUSH_DEBOUNCE_SECONDS//[[:space:]]/}"
          if ! [[ "$seconds" =~ ^[0-9]+$ ]]; then
            echo "::warning title=AGENT_REVIEW_PUSH_DEBOUNCE_SECONDS ignored::'$AGENT_REVIEW_PUSH_DEBOUNCE_SECONDS' is not a whole number of seconds; not waiting."
            exit 0
          fi
          if [ "$seconds" -gt 0 ]; then
            echo "Waiting ${seconds}s for further pushes; a newer push cancels this run before it spends anything."
            sleep "$seconds"
          fi

      - name: Install Claude Code
        env:
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-bin
          # Optional: pin the binary's SHA-256 yourself. Empty means the publisher's manifest.
          CLAUDE_CODE_SHA256: ""
        run: |
          bash scripts/agent-review/install-claude-code.sh
          echo "$CLAUDE_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Review the pull request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # `opened`, `ready_for_review` or `synchronize`: each counts against the automatic ceiling.
          AGENT_REVIEW_TRIGGER: ${{ github.event.action }}
        # `--config=<path>` needs the equals sign: `-c <path>` did not replace the head's config
        # in Bun 1.3.4. `--no-env-file` keeps the head's `.env` out of this process.
        run: bun --no-env-file --config=scripts/agent-review/bunfig.toml scripts/agent-review/cli.ts review "$PR" --repo-dir .

  threads:
    name: Wachiman thread replies
    # EDIT THIS: replace 'your-github-login' below with the operator's login, and keep it equal to
    # AGENT_REVIEW_OPERATOR above. A comment in the review panel starts the job when the operator wrote
    # it and it is a reply, or when it starts with the mention and the operator or (only when
    # `askers` is `write`, see above) an OWNER, MEMBER or COLLABORATOR wrote it, on a head in this
    # repository. The collaborator case is a cheap pre-filter: the engine checks the login again,
    # answers a collaborator only under GitHub's write permission, and acts only when the head was
    # already reviewed.
    if: |
      github.event_name == 'pull_request_review_comment' &&
      github.event.comment.user.type != 'Bot' &&
      ((github.event.comment.user.login == 'your-github-login' && github.event.comment.in_reply_to_id) ||
       ((startsWith(github.event.comment.body, '/wachi') ||
         startsWith(github.event.comment.body, '@agent-review') ||
         startsWith(github.event.comment.body, '@claude')) &&
        (github.event.comment.user.login == 'your-github-login' ||
         ('operator' == 'write' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its own group, never cancelling: a reply must not cancel the review of a push that arrived
    # seconds before. GitHub keeps one pending run per group, and a run handles every pending
    # thread, so a dropped pending run loses nothing.
    concurrency:
      group: agent-review-threads-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install Claude Code
        env:
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-bin
          # Optional: pin the binary's SHA-256 yourself. Empty means the publisher's manifest.
          CLAUDE_CODE_SHA256: ""
        run: |
          bash scripts/agent-review/install-claude-code.sh
          echo "$CLAUDE_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Answer the pending threads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENT_REVIEW_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # The reply's text and place, for a question in a thread (environment only, never interpolated).
          REQUEST: ${{ github.event.comment.body }}
          AGENT_REVIEW_COMMENT_ID: ${{ github.event.comment.id }}
          AGENT_REVIEW_COMMENT_IN_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
          AGENT_REVIEW_COMMENT_PATH: ${{ github.event.comment.path }}
          AGENT_REVIEW_COMMENT_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
        run: bun --no-env-file --config=scripts/agent-review/bunfig.toml scripts/agent-review/cli.ts threads "$PR" --repo-dir .

  on-demand:
    name: Wachiman on demand
    # EDIT THIS: replace 'your-github-login' below with the operator's login, and keep it equal
    # to AGENT_REVIEW_OPERATOR above (a job `if:` cannot read `env`). Matching by login works
    # for user-owned and organisation-owned repositories alike (`author_association` is `OWNER`
    # in the first and `MEMBER` in the second). `@agent-review` and `@claude` are accepted as aliases
    # while installed copies migrate. A comment that starts with the mention from an OWNER, MEMBER
    # or COLLABORATOR also starts the job, but only when `askers` is `write` (the `'operator' == 'write'`
    # literal in the threads job, changed with AGENT_REVIEW_ASKERS at the top), as a pre-filter only:
    # the engine refuses it unless GitHub confirms write access.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.user.login == 'your-github-login' ||
       (github.event.comment.user.type != 'Bot' &&
        'operator' == 'write' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/wachi') ||
         startsWith(github.event.comment.body, '@agent-review') ||
         startsWith(github.event.comment.body, '@claude')))) &&
      (contains(github.event.comment.body, '/wachi') ||
       contains(github.event.comment.body, '@agent-review') ||
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30 # batches run one after another
    # The operator's runs keep their group and cancel one another. A collaborator's question has its
    # own group that never cancels, so it cannot cancel the operator's review of the pull request.
    # The login is a literal here because a concurrency block cannot read env: keep it equal to
    # AGENT_REVIEW_OPERATOR.
    concurrency:
      group: agent-on-demand-${{ github.event.issue.number }}${{ github.event.comment.user.login != 'your-github-login' && '-ask' || '' }}
      cancel-in-progress: ${{ github.event.comment.user.login == 'your-github-login' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # `issue_comment` carries no head repository, so check it before anything reads the
      # head: on a fork's pull request the job stops instead of running its code with the key.
      - name: Refuse a fork pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "Pull request #$PR comes from $head, not $GITHUB_REPOSITORY; not running." >&2
            exit 1
          fi

      # The agent reads the pull request head; the CLI that holds the key comes from
      # the default branch, with the provider settings next to it. `--restricted` makes
      # Claude Code ignore the head's `.claude/` settings and hooks; that is not a sandbox,
      # and the trust assumption in the header still covers the rest.
      - name: Checkout the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Checkout the default branch's CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .ci-main
          sparse-checkout: scripts/agent-review
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install Claude Code
        env:
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-bin
          # Optional: pin the binary's SHA-256 yourself. Empty means the publisher's manifest.
          CLAUDE_CODE_SHA256: ""
        run: |
          bash .ci-main/scripts/agent-review/install-claude-code.sh
          echo "$CLAUDE_INSTALL_DIR" >> "$GITHUB_PATH"

      # The comment reaches the CLI through the environment, never interpolated
      # into the shell, so its text cannot run as a command.
      - name: Review or answer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          REQUEST: ${{ github.event.comment.body }}
          AGENT_REVIEW_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: bun --no-env-file --config=.ci-main/scripts/agent-review/bunfig.toml .ci-main/scripts/agent-review/cli.ts comment "$PR" --repo-dir .
