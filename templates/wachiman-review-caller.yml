name: Wachiman review
# Get the key at https://console.anthropic.com and save it as the repository secret ANTHROPIC_API_KEY.
# Pin an exact release tag (`@v1.5.0`): it names the release whose workflow and engine run with your
# key. Maintainers do not move release tags, but a repository admin can; a full commit SHA cannot be
# re-pointed (see docs/install.md, "What pinning a version does and does not guarantee"). Do not use
# the floating `@v1`: it would run each new release with your key before you have seen it.
# Updates reach you only when you change this line, by hand or through a Dependabot pull request you
# enable and read. A bad release is undone by editing the pin back.
# First install: the installing pull request can get the automatic review. `/wachiman review` works once
# this file is on the default branch, because `issue_comment` runs from there. A reply you write in a
# review thread (`pull_request_review_comment`) gets an answer without a push, once the head has been
# reviewed; a new line comment that asks after the command word is answered under itself. Replies from
# anyone else start nothing, unless `askers: write` is set below.
# `synchronize` reviews every push to an open pull request, only the commits that are new since the
# last review (a rebase with no change in content only moves the marker and costs no model call).
# Each push can spend up to `budget_usd`, and all automatic runs on one pull request together up to
# `auto_budget_usd` (default $2; `/wachiman review` is not limited by it). To review only on open and on
# `/wachiman review`, remove `synchronize` here, or keep it and pass `review_on_push: false` below.
# Remove `pull_request_review_comment` to stop answering thread replies. The triggers live in this
# file: bumping the pinned release does not add them to a caller that already exists.
on:
  pull_request: { types: [opened, ready_for_review, synchronize] }
  pull_request_review_comment: { types: [created] }
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/review.yml@v1.5.0
    with:
      operator: EDIT-THIS-github-login
      # review_on_push: false   # review only on open, ready for review and `/wachiman review`
      # push_debounce_seconds: 180   # a push waits this long first; a newer push cancels it unspent (0 = no wait)
      # pr_confidence: true     # trial: grade whether the diff does what the title and body say, in the description (docs/pr-confidence.md)
      # auto_budget_usd: 2      # most all automatic runs on one pull request may spend together
      # askers: write          # collaborators with admin, maintain or write permission may ask questions too (default: operator)
      # ask_ceiling_usd: 3     # most all questions from people other than the operator may spend on one pull request
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
